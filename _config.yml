# ── Site Config ──────────────────────────────────────────────
title: "Parker Knabb — Broadcast Engineering & AV Infrastructure"
description: "Purdue Computer Engineering senior seeking broadcast engineering roles and apprenticeships, including mobile production / OB. I design, build, and run live production systems, from a 22-PC esports arena to a corporate research studio."
url: "https://parkerknabb.com"
baseurl: ""

# ── Author ────────────────────────────────────────────────────
author:
  name: Parker Knabb
  email: parker@parkerknabb.com
  linkedin: https://linkedin.com/in/parker-knabb
  
headshot: true
headshot_ext: webp

# ── Open Graph / Social ───────────────────────────────────────
og_image: /images/og-card.jpg
twitter_handle: ""

# ── Build ─────────────────────────────────────────────────────
markdown: kramdown
permalink: pretty

# The github-pages gem defaults to theme: jekyll-theme-primer when this is
# unset, which ships its own assets/css/style.scss. On a full rebuild that
# compiles to the same output path as our own assets/css/style.css and can
# overwrite it, breaking all site styling. Explicitly disable it.
theme: null

# force_polling works around filesystems (WSL, some network/overlay mounts)
# where the default inotify-based file watcher misses changes.
force_polling: true

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - PRODUCT.md
  - DESIGN.md
  - .impeccable
  - node_modules
  - vendor
  - match-schedule/worker.js
  - match-schedule/wrangler.toml
