# Timeline entries, newest first in this file. The page shows them oldest
# first, so the story starts at Origins and ends at the present.
# photos is optional — remove those lines if there are no gallery images.
# org_url is optional.
# docs_link/docs_label are optional — for linking to external documentation.
# system is optional — the id of a case study in _data/systems/ to link to.
#
# Blurb style: one concrete moment → what I did (specific enough for an
# engineer to recognize) → one-sentence takeaway. ~60–90 words. The résumé
# covers the what and the Systems section covers the how; this is the why.

- year: "2026–"
  org: IBHS, Richburg, SC
  org_url: https://ibhs.org
  title: Broadcast Engineering Intern → Broadcast Systems Engineer (Part-time)
  system: ibhs
  desc: >-
    I built the esports system from a blank page. IBHS was the opposite: an
    established facility with a real budget and other people's workflows
    already running. First I had to make the case for changing something
    that worked. Then I moved switching to an ATEM and tied it together in
    Companion while shows kept running on the old system. The new one
    carried its first live event nine weeks in. These days the work is RF
    and fiber, with a Spectera deployment and a dark-fiber link across
    campus both still in progress.
  photos:
    - /images/timeline/ibhs/01.webp
    - /images/timeline/ibhs/02.webp
    - /images/timeline/ibhs/03.webp
    - /images/timeline/ibhs/04.webp

- year: "2026–27"
  org: Purdue Varsity Glee Club
  org_url: https://www.purdue.edu/pmo/ensembles/purdue-varsity-glee-club.php
  title: Audio Engineer
  desc: >-
    Three years on the risers taught me what a mix sounds like from inside
    it. For 2026–27 I'm behind the console on tour, making the calls I used
    to trust someone else was making. If anyone in the audience notices the
    mix, something has gone wrong.
