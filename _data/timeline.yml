    - /images/timeline/dreamhack/03.webp
    - /images/timeline/dreamhack/04.webp

- year: "2022"
  org: NCR Corporation
  org_url: https://en.wikipedia.org/wiki/NCR_Corporation
  title: IT Intern
  desc: >-
    Three weeks at a Fortune 500, never on the same task twice. I noticed a
    repetitive internal process and built a batch script to automate it. Its
    foundation, since evolved into PowerShell, still powers the TechKnow Bar
    today. It's the least broadcast thing on this page, but it's where I
    learned to look for the repeated step in a workflow, which is most of
    what a good Companion page is.
  photos:
    - /images/timeline/ncr/01.webp
    - /images/timeline/ncr/02.webp

- year: "2021–23"
  org: Johnson Ferry Baptist Church
  org_url: https://johnsonferry.org
  title: Camera Operator & Video Director
  desc: >-
    Where I learned that live means live. I was on a Hitachi camera and
    Clear-Com before I had any real training, and later directed the video
    myself. There were no second takes: you trust your preparation, your
