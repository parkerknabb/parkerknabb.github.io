- year: "2026–"
  org: IBHS — Richburg, SC
  org_url: https://ibhs.org
  title: Broadcast Engineering Intern → Broadcast Systems Engineer (Part-time)
  desc: >-
    I built the esports system from a blank page. IBHS was the opposite: an
    established facility, a real budget, and other people's workflows
    already running. The job was making a case for change inside something
    that worked, then moving switching to an ATEM and tying it together in
    Companion without disrupting the shows still on the old system. It
    carried its first live event nine weeks in. Now the work is RF and
    fiber: a Spectera deployment and a dark-fiber link across campus, both
    still in progress.
  photos:
    - /images/timeline/ibhs/01.webp
    - /images/timeline/ibhs/02.webp
    - /images/timeline/ibhs/03.webp
    - /images/timeline/ibhs/04.webp

- year: "2026–27"
  org: Purdue Varsity Glee Club
  org_url: https://www.purdue.edu/pmo/ensembles/purdue-varsity-glee-club.php
  title: Audio Engineer
  desc: >-
    Three years on the risers taught me what a mix sounds like from inside
    it. For 2026–27 I'm behind the console on tour, making the calls I used
    to trust someone else was making. The people relying on it only notice
    when something goes wrong, so the job is making sure they never have a
    reason to.
