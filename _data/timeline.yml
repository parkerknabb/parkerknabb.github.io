- year: "2026"
  org: LEAP (Live Events And Productions) student production club
  org_url: https://boilerlink.purdue.edu/organization/leap-purdue
  title: LED Tech, EDM Show at the Purdue Armory
  desc: >-
    Three LED panel types (Firefly, Coleder, and PixelFLEX) had to work as one
    wall, on stage and flown, and I had never opened NovaLCT. I had six hours
    before doors. I got all three running by working through the NovaStar
    documentation one panel type at a time. Mostly it taught me to read a
    vendor manual fast.
  photos:
    - /images/timeline/leap/01.webp
    - /images/timeline/leap/02.webp
    - /images/timeline/leap/03.webp
    - /images/timeline/leap/04.webp

- year: "2025–"
  org: Purdue Esports
  org_url: https://esports.purdue.edu
  title: Broadcast Engineering Coordinator
  system: esports
  desc: >-
    I started at the Alienware Gaming Lounge in November 2024, helping the
    outgoing coordinator with broadcast operations, and took over the program
    in August 2025. I built the system with no budget and no precedent, so
    every call was mine, and most of the design came from working around
    what the lounge didn't have. Now I lead a crew of three. The
    documentation matters as much as the rack, because the crew runs the
    show when I'm not there.
  photos:
    - /images/timeline/esports/01.webp
    - /images/timeline/esports/02.webp

- year: "2025"
  org: GoTo Foods
  org_url: https://gotofoods.com
  title: Enterprise IT Infrastructure Intern
  desc: >-
    An enterprise IT internship showed me how slowly infrastructure
    decisions move at scale, usually for reasons you can't see from the
    outside. Between network deployments and PowerShell and Python
    automation, I learned why change control exists and why nobody skips it.
    It also told me I want to be closer to live systems, where that same
    discipline has to happen on a show clock.
  photos:
    - /images/timeline/gtf/01.webp

- year: "2023–"
  org: Purdue Hall of Music Productions
  org_url: https://purdue.edu/hallofmusic
  title: Production Staff
  desc: >-
    Most Hall of Music shifts are set and strike for university events:
    build it, support it, tear it down on someone else's timeline. On a
    handful of Purdue football and basketball games I worked camera
    grip/utility, supporting the operator on JVC cameras and listening on
    Riedel Bolero to how a director calls a game. On Purdue Grand Prix, one
    of the few full multicam shows HoM produces each year, I ran a camera
    myself in 2025 and 2026. Those shows are the closest I've been to where
    I'm headed.

- year: "2022–23"
  org: GeorgiaFIRST Robotics
  org_url: https://gafirst.org
  title: Technical Director & Producer · Peachtree Live
  desc: >-
    I was 17 when GeorgiaFIRST asked me to build a commentary show from
    scratch for two multi-day tournaments with 2,000+ spectators. The most
    useful engineering happened off camera. The event's Studio Technologies
    Dante intercom only reached crew at the desk, so I patched channels
    through Dante Virtual Soundcard into TeamSpeak and put roaming crew on
    comms from their own phones, at zero cost. It wasn't elegant, but it
    worked. I still start a system the same way: find the constraint, then
    the simplest fix that holds up through the show.
  photos:
    - /images/timeline/georgiafirst/01.webp
    - /images/timeline/georgiafirst/02.webp
    - /images/timeline/georgiafirst/03.webp
    - /images/timeline/georgiafirst/04.webp

- year: "2022"
  org: DreamHack Atlanta
  org_url: https://dreamhack.com/atlanta
  title: Creator Hub · Livestream Technician
  desc: >-
    My first paid production gig: four days in the Creator Hub getting
    streamers and creators live in OBS, and by the end, acting as panel stage
    manager too. It was bigger than anything I'd worked, and I learned it on
    the floor. I came back as a Livestream Technician in May 2026. The event
    had grown, but the job was the same: get other people on air cleanly.
  photos:
    - /images/timeline/dreamhack/01.webp
    - /images/timeline/dreamhack/02.webp
    - /images/timeline/dreamhack/03.webp
    - /images/timeline/dreamhack/04.webp

- year: "2022"
  org: NCR Corporation
  org_url: https://en.wikipedia.org/wiki/NCR_Corporation
  title: IT Intern
  desc: >-
    Three weeks at a Fortune 500, never on the same task twice. I noticed a
    repetitive internal process and built a batch script to automate it.
    It's been rewritten in PowerShell since, and the TechKnow Bar still runs
    on it. It's the least broadcast thing on this page, but it's where I
    learned to look for the repeated step in a workflow, which is most of
    what a good Companion page is.
  photos:
    - /images/timeline/ncr/01.webp
    - /images/timeline/ncr/02.webp

- year: "2021–23"
  org: Johnson Ferry Baptist Church
  org_url: https://johnsonferry.org
  title: Camera Operator & Video Director
  desc: >-
    Where I learned that live means live. I was on a Hitachi camera and
    Clear-Com before I had any real training, and later directed the video
    myself. There were no second takes, so you trusted your prep and the
    person calling the show. Nearly everything since has been a bigger
    version of a Sunday service.
  photos:
    - /images/timeline/church/01.webp
    - /images/timeline/church/02.webp

