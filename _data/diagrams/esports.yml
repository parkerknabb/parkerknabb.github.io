# Purdue Esports signal-flow diagram. Fields: see README.md in this folder.

# Standard in-person show. PXE/lab boot, remote production and Discord ops are out of scope on purpose.
label: View signal flow
hint: vMix · OBS · RØDECaster · Companion
alt: Simplified Purdue Esports studio signal flow for a standard in-person show. Casting cameras go over HDMI
  into a Cam Link Pro in a Thunderbolt breakout on a laptop, which sends them to vMix as OMT. Three observer PCs
  also send OMT to vMix. Caster microphones go into a RØDECaster Pro II over XLR; vMix sends game audio to it
  on an aux bus and takes the master mix back over USB. vMix sends program to OBS over OMT, and OBS streams and
  records it. vMix fullscreen outputs drive the multiview and the studio monitors. Bitfocus Companion,
  with a Stream Deck XL and a Stream Deck Mini, controls vMix and the RØDECaster over MIDI.
caption: Pick a layer to isolate its paths.
layers:
- id: overview
  label: Overview
  summary: Video, outputs, audio and control are separate layers of one system.
- id: audio
  label: Audio
  summary: Everything meets at the RØDECaster, so all audio is on one set of physical faders.
  points:
  - Caster microphones go straight into the RØDECaster Pro II over XLR.
  - Game audio rides inside the OMT streams from the observer PCs (and from the lab PC at special events), so
    it reaches vMix with its video. vMix sends it out on an aux bus to the RØDECaster.
  - The mix returns to vMix over USB through a virtual audio device driver, taken from the RØDECaster master bus,
    and vMix transmits it.
  - Casters listen on the RØDECaster's headphone outputs. The mixer's own routing sets what each of them hears.
- id: video
  label: Video
  summary: Cameras and observer PCs in as OMT, one program out.
  points:
  - The casting cameras (Blackmagic Micro Studio 4K G2) output HDMI into an Elgato Cam Link Pro in a Thunderbolt
    breakout on a laptop, which sends them to vMix as OMT. The lounge PCs have no free PCIe slots, so this is
    the capture path.
  - 'Three observer PCs in the broadcast room send OMT to vMix: game or window capture when it works, full display
    capture when it doesn''t.'
  - vMix is the switcher and graphics engine. It sends program to OBS over OMT.
  - Fighting-game events add a lab PC with a second network adapter. It bridges the segmented lab and broadcast
    networks and pulls OMT straight from the player stations.
- id: outputs
  label: Outputs
  summary: Where program goes after vMix.
  points:
  - 'Stream and recording: OBS is the only encoder. It streams program and records it. vMix does neither.'
  - 'Multiview: a vMix fullscreen output on a GPU HDMI port drives the control-room multiview.'
  - 'Studio monitors: a second vMix fullscreen output on a GPU HDMI port carries program to the on-site monitors.'
- id: control
  label: Control
  summary: Companion drives vMix and the mixer; the Stream Deck XL runs the show.
  points:
  - Bitfocus Companion controls vMix and the RØDECaster Pro II over MIDI.
  - Each game title is one button on the Stream Deck XL's overlay row, and the per-game overlay and routing are
    automated in Companion.
  - Button layouts change with context through Companion custom variables.
  - The caster table has its own Stream Deck Mini through Companion Satellite.
