# IBHS studio signal flow. Fields: see README.md in this folder.
alt: >-
  Simplified IBHS studio signal flow. Eight SDI sources feed the ATEM 4K8.
  Studio microphones feed the X32 over XLR; remote guest audio arrives over USB
  and OBS playback over 3.5 mm. Remote guest video reaches OBS over NDI.
  The OBS rig uses a DeckLink 8K Pro G2 with three SDI inputs from the ATEM
  (Program, GFX 1 and GFX 2) and one GFX output back to the switcher.
  The X32 sends mixed audio to the ATEM, which streams and records program.
  Bitfocus Companion and a Stream Deck control the ATEM, OBS and X32.
caption: Simplified. Layers isolate the video, audio and control paths of the same system.
layers:
- id: overview
  label: Overview
  summary: Video, outputs, audio and control are separate layers of one system. Pick a layer to isolate its paths.
- id: audio
  label: Audio
  summary: Every source meets at the X32; one mixed feed goes to the ATEM.
  points:
  - 'Studio mics and Sennheiser EW-DX wireless lavs feed the X32 over XLR.'
  - Remote guest audio arrives from ZoomISO over USB. OBS playback, such as package videos, arrives over 3.5 mm.
  - The X32 sends one mixed feed to the ATEM, which carries it in the stream and the recording.
  - 'Talkback runs from Companion: talk to the guest, and listen to the guest or any of four lavs. '
  - 'Troubleshooting rule: if a guest can''t be heard, confirm them on the X32 before touching OBS.'
- id: video
  label: Video
  summary: 'Everything on screen: guest feeds in, switched program out.'
  points:
  - 'Remote guests: ZoomISO outputs eight NDI feeds (Guest 1–4, Share 1–4). An NDI Router maps them to named destinations
    (Box 1–4, Pres Speaker, Pres Deck) that OBS reads.'
  - 'OBS builds the graphics and guest layouts: 20 live scenes, each tied to a Companion button, covering studio
    2-, 3- and 4-box layouts, full-screen guests, presentation, media and countdown, with Lottie lower thirds.'
  - The ATEM uses all eight SDI inputs and routes sources to the studio monitors. The OBS rig
    uses a DeckLink 8K Pro G2 configured for three inputs from the ATEM (Program, GFX 1 and GFX 2)
    and one GFX output back to the switcher.
  - Program leaves as an RTMP stream and is recorded on the switcher.
  - ZoomISO's Video Loss Mode is set to Testcard while verifying routing, then Freeze during the show.
- id: outputs
  label: Outputs
  points:
  - 'Stream and recording: program leaves the ATEM as an RTMP stream, and the switcher records it.'
  - 'Multiview: the ATEM''s multiview output drives the control-room multiview.'
  - 'Studio monitors: ATEM aux outputs feed the in-studio displays, including the talent confidence monitors. The
    TV CTRL menu on the Stream Deck picks what each one shows.'
  - Three ATEM feeds (Program, GFX 1 and GFX 2) enter the OBS rig through its DeckLink 8K Pro G2.
    The fourth bidirectional port sends GFX back to the ATEM.
  summary: Where program goes after the ATEM.
- id: control
  label: Control
  summary: One Stream Deck runs the studio through Bitfocus Companion.
  points:
  - One Stream Deck + XL, through Companion, talks to the ATEM, OBS, X32 and both Sennheiser receivers.
  - 'In-studio routing lives on the same deck. The TV CTRL menu sends ATEM aux outputs to the confidence monitors
    talent see, and a talkback page gives granular control over who hears whom.'
  - 'Six pages: main show control, talkback, TV routing, PC routing, lower-third assignment, and a compatibility
    page that keeps the old workflow running.'
  - OBS scene names are the contract between OBS and Companion. A scene isn't renamed without updating its buttons.
  - Guest slots 1–4 are the same number in ZoomISO, the NDI Router, the OBS scene names and the Stream Deck.
  - A dedicated page handles lower-third assignment across six studio slots.
