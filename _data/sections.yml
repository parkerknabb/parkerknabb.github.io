# Section headings and intros.
# HTML is supported in intros (<strong>, etc.).
#
# The page leads with systems and event evidence, then the path to it:
#   Systems: Purdue Esports, IBHS, and the LEAP IMAG show.
#   Story:   how I got to either one.
#   Contact: the next system.

systems:
  # Which files in _data/systems/ show, in order.
  order: [esports, ibhs, leap]
  heading: Built for the people running the show.
  intro: >-
    I've had the opportunity to work on systems for a collegiate esports studio, a working research facility, and a live IMAG
    show. Different constraints, the same approach: build options into the
    system so operators can adapt on the day without touching the plumbing.
    These are the designs, decisions and documentation behind the shows.

# The system-specific figures (crew of 3, 41h, 9 wk) now live with their
# system in _data/systems/<id>.yml under `facts`.
# Not rendered yet: needs a home (see the Story intro).
years:
  num: "5+"
  label: Years operating broadcast & AV systems

story:
  heading: The long way here.
  intro:
    - >-
      Purdue doesn't have a broadcast engineering program, and there's no
      career-fair track for this field. I found the work one show at a time,
      starting long before college.
    - >-
      A tour of The Weather Channel's broadcast facility, with a server room
      spanning half a floor and centralized processing at scale, made the
      destination clear. <strong>This is the work I want to do.</strong>

contact:
  heading: Put me on the crew.
  intro:
    - >-
      I want to build a career in sports broadcast engineering: preparing,
      integrating, maintaining and supporting some of the world's most advanced broadcast systems.
    - >-
      Seeking broadcast engineering roles and apprenticeships starting May
      2027. Open to relocation and extensive travel.

technical:
  heading: At the rack and on site.
  rows:
    - label: Integration
      text: >-
        Rack wiring and documentation; SDI and Ethernet termination.
        Blackmagic, Ross and Roland switchers, Sierra Video routers,
        NovaStar LED processors.
    - label: Transport & networks
      text: >-
        SDI, fiber, NDI, OMT, SRT, Dante / AES67.
        VLAN segmentation and PXE boot.
    - label: Intercom
      text: >-
        Studio Technologies Dante, Clear-Com, Riedel Bolero, Green-GO.
    - label: Audio & RF
      text: >-
        X32, M32 and Yamaha consoles; AES50.
        Sennheiser EW-DX, Shure ULX-S; Spectera deployment in progress.
    - label: Field production
      text: >-
        Camera grip/utility for Purdue football and basketball.
        Camera operator for Purdue Grand Prix.
    - label: Software & code
      text: >-
        Companion, vMix, OBS, NovaLCT.
        Python, PowerShell, C/C++, SystemVerilog.
