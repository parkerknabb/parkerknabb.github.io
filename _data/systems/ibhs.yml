dates: May 2026–
title: Studio broadcast system
label: Live system
facts:
  - num: "9 wk"
    label: Studio redesign to first live event at IBHS
diagram: ibhs
summary: >-
  An established studio with events already on the calendar. I built a
  Companion-driven control layer over its ATEM, OBS and X32 in parallel
  with the Studio 6 workflow, without interrupting live events.
gear:
  - Blackmagic ATEM 4K8
  - OBS Studio
  - Blackmagic DeckLink 8K Pro G2
  - Behringer X32 Compact
  - Bitfocus Companion
  - Stream Deck + XL
  - Sennheiser EW-DX
  - Sierra Video routing
  - ZoomISO
  - NDI
notes:
  - title: One program, one place.
    text: >-
      Switching, streaming and recording now live on the ATEM, so the program
      operators see on the multiview is the one that airs. OBS handles graphics,
      media and guest layouts.
  - title: Hide the complexity.
    text: >-
      The team runs shows alongside other responsibilities. Companion puts
      routing, graphics and talkback on the Stream Deck, while program switching
      stays on the ATEM. Routine show operations use physical controls rather
      than sending operators through software menus.
  - title: Migrate alongside live shows.
    text: >-
      Reusing familiar hardware kept retraining small. I carried improvements
      back to the old workflow during development, so the team benefited
      before the new system launched. The old system remains available as
      a fallback.
next: >-
  Spectera deployment is in progress as a replacement for legacy mic/IFB.
